name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: clippy,rustfmt
      - name: Install GNU COBOL and PostgreSQL headers
        run: sudo apt-get update && sudo apt-get install --yes gnucobol libpq-dev
      - name: Check shell scripts
        run: bash -n build.sh reset.sh scripts/*.sh
      - name: Format Rust
        run: cargo fmt --manifest-path target/Cargo.toml --all -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path target/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path target/Cargo.toml --locked
      - name: Document Rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path target/Cargo.toml --no-deps --document-private-items --locked
      - name: Build both services
        run: ./build.sh
