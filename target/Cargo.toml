[package]
name = "inventory-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Rust target for the Parity inventory migration example"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
excessive_nesting = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "warn"

[workspace]
